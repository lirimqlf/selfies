name: 🤖 SelfieBot - Keep Alive

on:
  schedule:
    # Redémarrage toutes les 4 minutes 55 secondes (GitHub Actions = 5 min min)
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Lancement manuel possible

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🐍 Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Installer les dépendances
        run: pip install -r requirements.txt

      - name: 🚀 Lancer le bot (290 secondes max)
        run: timeout 290 python bot.py || true
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
